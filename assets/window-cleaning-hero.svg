<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Soft water droplets on clean glass</title>
  <desc id="desc">A light blue clean-glass background with soft water droplets and gentle reflections.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f2fbff"/>
      <stop offset="0.48" stop-color="#d9f3fb"/>
      <stop offset="1" stop-color="#a9dce9"/>
    </linearGradient>
    <radialGradient id="drop" cx="35%" cy="25%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.48" stop-color="#d7f4fb" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#2f91a3" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="1800" height="1200" fill="url(#sky)"/>
  <path d="M0 0h650L245 1200H0z" fill="#fff" opacity="0.32"/>
  <path d="M910 0h890v1200h-500z" fill="#fff" opacity="0.22"/>
  <path d="M180 205c390-80 735-90 1235-8" fill="none" stroke="#fff" stroke-width="26" opacity="0.32"/>
  <path d="M250 650c355-45 760-52 1295 18" fill="none" stroke="#fff" stroke-width="18" opacity="0.22"/>
  <g filter="url(#soft)">
    <ellipse cx="1175" cy="270" rx="35" ry="49" fill="url(#drop)" transform="rotate(-14 1175 270)"/>
    <ellipse cx="1390" cy="410" rx="22" ry="32" fill="url(#drop)" transform="rotate(12 1390 410)"/>
    <ellipse cx="980" cy="520" rx="26" ry="38" fill="url(#drop)" transform="rotate(-8 980 520)"/>
    <ellipse cx="1515" cy="720" rx="42" ry="60" fill="url(#drop)" transform="rotate(10 1515 720)"/>
    <ellipse cx="1260" cy="870" rx="21" ry="31" fill="url(#drop)" transform="rotate(-18 1260 870)"/>
    <ellipse cx="760" cy="305" rx="18" ry="26" fill="url(#drop)" transform="rotate(14 760 305)"/>
    <ellipse cx="615" cy="785" rx="31" ry="45" fill="url(#drop)" transform="rotate(-10 615 785)"/>
    <ellipse cx="410" cy="470" rx="20" ry="30" fill="url(#drop)" transform="rotate(8 410 470)"/>
  </g>
  <g fill="#fff" opacity="0.55">
    <circle cx="1080" cy="355" r="6"/>
    <circle cx="1335" cy="320" r="5"/>
    <circle cx="1450" cy="575" r="8"/>
    <circle cx="890" cy="705" r="7"/>
    <circle cx="700" cy="545" r="5"/>
    <circle cx="520" cy="905" r="8"/>
  </g>
  <rect y="1030" width="1800" height="170" fill="#6fb9c9" opacity="0.12"/>
